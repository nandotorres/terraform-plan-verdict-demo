name: Plan Verdict

on:
  pull_request:
    paths:
      - "infra/**"

permissions: {}

concurrency:
  group: plan-verdict-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verdict:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write # post the verdict comment and labels
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          disable-sudo: true
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_wrapper: false

      # Apply the base branch's infra (offline) so the PR plan shows a real
      # diff — updates, replacements, and deletions, not just creates.
      - name: Establish baseline state from the base branch
        run: |
          set -euo pipefail
          git worktree add /tmp/base "origin/${{ github.base_ref }}"
          if [ -d /tmp/base/infra ]; then
            ( cd /tmp/base/infra
              terraform init -input=false -no-color
              terraform apply -auto-approve -input=false -no-color )
            cp /tmp/base/infra/terraform.tfstate infra/terraform.tfstate
          fi

      - name: Plan the pull request
        working-directory: infra
        run: |
          set -euo pipefail
          terraform init -input=false -no-color
          terraform plan -input=false -no-color -refresh=false -out=tfplan
          terraform show -json tfplan > plan.json

      - name: Score the plan
        uses: nandotorres/terraform-plan-verdict@main
        with:
          plan-json: infra/plan.json
          provider: rules
          comment: true
          labels: true
          fail-on: critical
