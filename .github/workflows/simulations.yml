name: Simulations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "simulations/**"
      - ".github/workflows/simulations.yml"

permissions: {}

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        sim: [low, medium, high, critical]
    steps:
      - uses: step-security/harden-runner@cb605e52c26070c328afc4562f0b4ada7618a84e # v2.10.4
        with:
          disable-sudo: true
          egress-policy: audit

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Score ${{ matrix.sim }} plan
        uses: nandotorres/terraform-plan-verdict@main
        with:
          plan-json: simulations/${{ matrix.sim }}.plan.json
          provider: rules
          comment: false
          labels: false
          summary: true
          fail-on: none
