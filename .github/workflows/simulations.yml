name: Simulations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "simulations/**"
      - ".github/workflows/simulations.yml"

permissions: {}

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        sim: [low, medium, high, critical]
    steps:
      - uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          disable-sudo: true
          egress-policy: audit

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Score ${{ matrix.sim }} plan
        uses: nandotorres/terraform-plan-verdict@v0
        with:
          plan-json: simulations/${{ matrix.sim }}.plan.json
          provider: rules
          comment: false
          labels: false
          summary: true
          fail-on: none
